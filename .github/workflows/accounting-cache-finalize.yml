name: Finalize Accounting cache versions

on:
  push:
    branches:
      - fix/accounting-final-polish-20260901

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accounting-final-polish-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bump changed Accounting assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/car-detail.html')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('../css/pages/accounting.css?v=33', '../css/pages/accounting.css?v=34'),
              ('/js/modules/accounting/accounting-controller.js?v=38', '/js/modules/accounting/accounting-controller.js?v=39'),
          ]:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one cache marker: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run complete regression suite
        run: npm test
      - name: Commit verified cache bump and remove temporary workflow
        run: |
          git config user.name "JLY Accounting CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/accounting-cache-finalize.yml
          git add pages/car-detail.html
          git commit -m "Bump final Accounting asset cache versions"
          git push origin HEAD:fix/accounting-final-polish-20260901
