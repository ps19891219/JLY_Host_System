name: Fix accounting live regressions

on:
  push:
    branches:
      - fix/accounting-live-regressions-20260901

permissions:
  contents: write

jobs:
  fix-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accounting-live-regressions-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply Accounting fixes
        run: python scripts/accounting-live-regressions-fix.py
      - name: Run complete regression suite
        run: npm test
      - name: Commit verified fix and remove temporary files
        run: |
          git config user.name "JLY Accounting CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/accounting-live-regressions-fix.yml scripts/accounting-live-regressions-fix.py
          git add shared/accounting/pairwise-obligation.js js/modules/accounting/accounting-render.js js/modules/accounting/accounting-actions.js js/modules/accounting/accounting-controller.js css/pages/accounting.css pages/car-detail.html tests/accounting/accounting-live-regressions.test.js
          git commit -m "Fix Accounting settled summary pending actions and inline split editing"
          git push origin HEAD:fix/accounting-live-regressions-20260901
