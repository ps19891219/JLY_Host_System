name: Batch maintenance branch test

on:
  push:
    branches:
      - feat/batch-public-role-reminder-accounting-reset-20260828
      - fix/line-player-entry-unify-car-view-20260906

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
