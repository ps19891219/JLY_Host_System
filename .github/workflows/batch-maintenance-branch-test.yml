name: Batch maintenance branch test

on:
  push:
    branches:
      - 'batch/**'
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Studio Booking focused regression
        run: node --test tests/studio-booking-*.test.js tests/studio-recruitment-*.test.js tests/studio-pending-action-read-budget.test.js tests/studio-permissions.test.js tests/studio-dm-membership-role-boundary.test.js
      - name: Full repository regression
        run: npm test
