name: Batch maintenance branch test

on:
  push:
    branches:
      - repair/person-dedupe-picker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test