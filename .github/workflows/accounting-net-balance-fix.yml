name: Accounting net balance fix

on:
  push:
    branches:
      - fix/accounting-net-current-balances-20260902

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[accounting-net-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accounting-net-current-balances-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply net-current balance patch
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(path, from, to) {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`Pattern not found in ${path}`);
            fs.writeFileSync(path, before.replace(from, to));
          }

          replaceExact(
            'js/modules/accounting/accounting-data.js',
            '    const people=[...byPerson.values()].map(item=>{const net=item.receivable-item.payable;return{...item,net,direction:net>0?"receivable":net<0?"payable":"settled",amount:Math.abs(net)};}).sort((a,b)=>a.personId.localeCompare(b.personId)),payableTotal=people.reduce((sum,item)=>sum+item.payable,0),receivableTotal=people.reduce((sum,item)=>sum+item.receivable,0),net=receivableTotal-payableTotal;\n',
            '    const people=[...byPerson.values()].map(item=>{const net=item.receivable-item.payable;return{...item,net,direction:net>0?"receivable":net<0?"payable":"settled",amount:Math.abs(net)};}).filter(item=>item.amount>0).sort((a,b)=>a.personId.localeCompare(b.personId)),payableTotal=people.filter(item=>item.direction==="payable").reduce((sum,item)=>sum+item.amount,0),receivableTotal=people.filter(item=>item.direction==="receivable").reduce((sum,item)=>sum+item.amount,0),net=receivableTotal-payableTotal;\n'
          );

          replaceExact(
            'js/modules/accounting/accounting-controller.js',
            '    const myAccounting=model.myAccounting||{people:[],payableTotal:0,receivableTotal:0,netAmount:0,direction:"settled"},grossPayable=Number(myAccounting.payableTotal||0),grossReceivable=Number(myAccounting.receivableTotal||0),netAmount=Number(myAccounting.netAmount||0),netLabel=myAccounting.direction==="receivable"?"應收":myAccounting.direction==="payable"?"應付":"已互抵";\n    const mySummary=document.createElement("section");mySummary.className="accounting-my-summary";mySummary.innerHTML=`<strong>我的帳務</strong><span class="accounting-my-summary-grid"><span>我欠誰<b>$${grossPayable.toLocaleString("zh-TW")}</b></span><span>誰欠我<b>$${grossReceivable.toLocaleString("zh-TW")}</b></span><span>互抵後<b>${netLabel}${netAmount?` $${netAmount.toLocaleString("zh-TW")}`:""}</b></span></span><button type="button" class="accounting-my-detail-toggle">查看我的明細 ›</button><div class="accounting-my-net-list" hidden>${myAccounting.people.length?myAccounting.people.map(item=>`<div class="accounting-dialog-row"><span><strong>${escapeHtml(model.memberNames.get(item.personId)||"成員")}</strong><small>同一對人物互抵後</small></span><b>${item.direction==="receivable"?"應收":item.direction==="payable"?"應付":"已互抵"}${item.amount?` $${Number(item.amount).toLocaleString("zh-TW")}`:""}</b></div>`).join(""):\'<p class="empty-text">目前沒有需要互抵的帳務</p>\'}<button type="button" class="accounting-my-person-link">查看人物帳目 ›</button></div>`;overview.after(mySummary);\n',
            '    const myAccounting=model.myAccounting||{people:[],payableTotal:0,receivableTotal:0,netAmount:0,direction:"settled"},currentPayable=Number(myAccounting.payableTotal||0),currentReceivable=Number(myAccounting.receivableTotal||0),netAmount=Number(myAccounting.netAmount||0),netText=myAccounting.direction==="receivable"?`應收 $${netAmount.toLocaleString("zh-TW")}`:myAccounting.direction==="payable"?`應付 $${netAmount.toLocaleString("zh-TW")}`:"$0";\n    const mySummary=document.createElement("section");mySummary.className="accounting-my-summary";mySummary.innerHTML=`<strong>我的帳務</strong><span class="accounting-my-summary-grid"><span>我欠誰<b>$${currentPayable.toLocaleString("zh-TW")}</b></span><span>誰欠我<b>$${currentReceivable.toLocaleString("zh-TW")}</b></span><span>互抵後<b>${netText}</b></span></span><button type="button" class="accounting-my-detail-toggle">查看我的明細 ›</button><div class="accounting-my-net-list" hidden>${myAccounting.people.length?myAccounting.people.map(item=>`<div class="accounting-dialog-row"><span><strong>${escapeHtml(model.memberNames.get(item.personId)||"成員")}</strong><small>目前互抵後餘額</small></span><b>${item.direction==="receivable"?"應收":"應付"} $${Number(item.amount).toLocaleString("zh-TW")}</b></div>`).join(""):\'<p class="empty-text">目前沒有未結清帳務</p>\'}<button type="button" class="accounting-my-person-link">查看人物帳目 ›</button></div>`;overview.after(mySummary);\n'
          );

          replaceExact('pages/car-detail.html', 'accounting-data.js?v=11', 'accounting-data.js?v=12');
          replaceExact('pages/car-detail.html', 'accounting-controller.js?v=40', 'accounting-controller.js?v=41');

          fs.appendFileSync('tests/accounting/accounting-live-regressions.test.js', `\n\ntest("我的帳務只顯示逐人物互抵後的目前餘額", () => {\n  const data = require("../../js/modules/accounting/accounting-data");\n  const result = data.personalAccountingProjection([\n    { fromPersonId:"me", toPersonId:"snow", amount:87 },\n    { fromPersonId:"snow", toPersonId:"me", amount:87 }\n  ], "me");\n  assert.equal(result.payableTotal, 0);\n  assert.equal(result.receivableTotal, 0);\n  assert.equal(result.netAmount, 0);\n  assert.deepEqual(result.people, []);\n});\n\ntest("互抵後新增金額會重新進入目前餘額", () => {\n  const data = require("../../js/modules/accounting/accounting-data");\n  const result = data.personalAccountingProjection([\n    { fromPersonId:"me", toPersonId:"snow", amount:87 },\n    { fromPersonId:"snow", toPersonId:"me", amount:87 },\n    { fromPersonId:"snow", toPersonId:"me", amount:50 }\n  ], "me");\n  assert.equal(result.payableTotal, 0);\n  assert.equal(result.receivableTotal, 50);\n  assert.equal(result.netAmount, 50);\n  assert.equal(result.people.length, 1);\n  assert.equal(result.people[0].direction, "receivable");\n  assert.equal(result.people[0].amount, 50);\n});\n\ntest("我的帳務零餘額不再顯示已互抵文字", () => {\n  const controller = fs.readFileSync(path.join(__dirname,"../../js/modules/accounting/accounting-controller.js"),"utf8");\n  const page = fs.readFileSync(path.join(__dirname,"../../pages/car-detail.html"),"utf8");\n  assert.equal(controller.includes(\'netLabel=myAccounting.direction==="receivable"?"應收":myAccounting.direction==="payable"?"應付":"已互抵"\'), false);\n  assert.match(controller,/netText=.*:"\\$0"/);\n  assert.match(controller,/目前沒有未結清帳務/);\n  assert.match(page,/accounting-data\\.js\\?v=12[\\s\\S]*accounting-controller\\.js\\?v=41/);\n});\n`);

          const mapPath='docs/PROJECT_MAP_V3.22_V3.24_APPEND.md';
          let map=fs.readFileSync(mapPath,'utf8');
          map=map.replace('> Range: V3.22 → V3.26','> Range: V3.22 → V3.27');
          const marker='## V3.26 Accounting Identity-before-Settlement Compatibility（2026-09-02）';
          const section='## V3.27 Accounting Current Net Balance Semantics（2026-09-02）\n\n- 「我的帳務」正式改為只顯示逐 Person 互抵後的目前未結清餘額；同一對人物雙向金額完全抵銷時，「我欠誰／誰欠我／互抵後」皆回到 `$0`，不再把互抵前 gross amount 留在摘要。\n- 完全互抵的 Person 不再保留「已互抵」狀態列；互抵是 Projection 計算過程，不是長期顯示狀態。之後若新增新的未結清 Transaction／Obligation，Projection 會重新依同一 Person 對手方計算並把新增淨額加入目前應付或應收。\n- Car Detail 與 LINE 仍共用同一 Activity Accounting Projection；不建立第二套互抵計算。Runtime assets：`accounting-data.js?v=12`、`accounting-controller.js?v=41`。\n\n';
          if(!map.includes(marker)) throw new Error('Project Map marker missing');
          map=map.replace(marker, section+marker);
          fs.writeFileSync(mapPath,map);
          NODE
      - run: npm ci
      - run: npm test
      - name: Commit verified patch
        run: |
          git config user.name "ps19891219"
          git config user.email "ps19891219@gmail.com"
          git rm .github/workflows/accounting-net-balance-fix.yml
          git add js/modules/accounting/accounting-data.js js/modules/accounting/accounting-controller.js pages/car-detail.html tests/accounting/accounting-live-regressions.test.js docs/PROJECT_MAP_V3.22_V3.24_APPEND.md
          git commit -m "[accounting-net-fixed] Use current net balances after pairwise offset"
          git push origin HEAD:fix/accounting-net-current-balances-20260902
