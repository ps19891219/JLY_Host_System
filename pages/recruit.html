<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>我的揪團｜JLY Host System</title>

  <link
    rel="stylesheet"
    href="../css/pages/recruit.css"
  >
</head>

<body>

<main class="recruit-page">
  <header class="recruit-header">
    <div class="recruit-brand">
      JLY Host System
    </div>

    <h1>
      我的揪團
    </h1>

    <button
      id="recruitBatchShareButton"
      class="recruit-batch-share-button"
      type="button"
    >
      📋 批次 LINE 揪團文案
    </button>

    <p>
      目前正在招募中的車團
    </p>
  </header>

  <section
    id="recruitTabs"
    class="recruit-tabs"
    aria-label="揪團分類"
  ></section>

  <section
    id="recruitCarList"
    class="recruit-car-list"
    aria-live="polite"
  >
    <div class="recruit-loading">
      載入中…
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="../js/firebase.js"></script>
