<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>工作室排班｜JLY</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pages/work-schedule.css?v=6"><style>.staff-only-note{font-size:13px;opacity:.7}.staff-mine-actions[hidden]{display:none}.staff-readonly-detail .detail-role{padding:12px 0}.staff-readonly-detail ol{margin:8px 0;padding-left:22px}.mine-person-name{color:#111;font-weight:800}</style></head><body><main class="work-schedule-page">
<div id="staffGate"><div class="card">正在確認 LINE 與工作室身分…</div></div>
<div id="staffApp" hidden><header class="work-schedule-header"><div><p class="eyebrow">JLY Studio Work Schedule</p><h1>🎭 工作室排班</h1><p id="staffIdentity"></p><p class="staff-only-note">員工唯讀模式</p></div></header>
<section class="dashboard-toolbar card"><form id="scheduleDateSearch" class="schedule-date-search" autocomplete="off"><label for="scheduleDateQuery">🔍 搜尋班表</label><div><input id="scheduleDateQuery" type="text" placeholder="工作、主揪、9月、9/27…" aria-label="搜尋工作室班表"><button type="submit">搜尋</button><button id="scheduleDateClear" type="button" class="ghost">清除</button></div><small>預設顯示全部排班；可搜尋工作名稱／主揪，或輸入月份、日期縮小範圍。</small></form><div class="view-tabs"><button type="button" data-staff-view="all" class="active">全部班表</button><button type="button" data-staff-view="mine">只看我的</button></div><div id="staffMineActions" class="dashboard-actions staff-mine-actions" hidden><button id="staffSelectAll" type="button">全選</button><button id="staffClear" type="button">清除</button><button id="staffSync" type="button">匯入／更新 Google Calendar</button><button id="staffRemoveCalendar" type="button">從 Google Calendar 移除</button></div></section>
<section id="staffSchedule" class="schedule-dashboard"><div class="empty">正在讀取班表…</div></section></div>
<dialog id="staffDetailDialog" class="group-detail-dialog staff-readonly-detail"><div class="dialog-shell"><header><div><p class="step-kicker">工作人員</p><h2 id="staffDetailTitle"></h2><p id="staffDetailMeta" class="dialog-meta"></p></div><button type="button" id="staffDetailClose" aria-label="關閉">✕</button></header><div id="staffDetailRoles"></div><small>員工唯讀模式：此處只能查看正式排班，不能修改人員、角色或班次。</small></div></dialog>
</main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="/js/line.js?v=3"></script><script src="/js/modules/calendar/calendar-config.js?v=1"></script><script src="/js/modules/calendar/calendar-auth.js?v=1"></script><script src="/js/modules/calendar/calendar-provider-google.js?v=2"></script><script src="/js/modules/calendar/calendar-schedule-check.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-read-renderer.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-staff-page.js?v=7"></script><script src="/js/modules/work-schedule/work-schedule-staff-calendar-remove.js?v=2"></script></body></html>
