<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>工作室排班｜JLY</title>
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pages/work-schedule.css?v=6">
  <style>.staff-shift-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.staff-shift-card h3{margin:.55rem 0}.staff-shift-card p{line-height:1.65}.staff-actions{position:sticky;bottom:0;padding:10px 0;background:rgba(255,255,255,.96);display:flex;gap:8px;flex-wrap:wrap}.staff-actions small{width:100%}.staff-readonly-note{margin:.5rem 0 0}</style>
</head>
<body><main class="work-schedule-page">
  <div id="staffGate"><div class="card">正在確認 LINE 與工作室身分…</div></div>
  <div id="staffApp" hidden>
    <header class="work-schedule-header"><div><p class="eyebrow">JLY Studio Work Schedule</p><h1>🎭 工作室排班</h1><p id="staffIdentity"></p><p class="staff-readonly-note">員工唯讀模式：排班資料與工作室正式 Work Schedule 共用同一份 Read View。</p></div></header>
    <section class="dashboard-toolbar card"><div class="view-tabs"><button type="button" data-staff-view="all" class="active">全部班表</button><button type="button" data-staff-view="mine">只看我的</button></div><div id="staffMineActions" class="dashboard-actions" hidden><button id="staffSelectAll" type="button">全選</button><button id="staffClear" type="button" class="ghost">清除</button><button id="staffSync" type="button">匯入／更新 Google Calendar</button><button id="staffRemoveCalendar" type="button" class="ghost">從 Google Calendar 移除</button></div></section>
    <section id="staffSchedule" class="schedule-dashboard"><div class="empty">正在讀取班表…</div></section>
  </div>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script><script src="/js/line.js?v=3"></script><script src="/js/modules/calendar/calendar-config.js?v=1"></script><script src="/js/modules/calendar/calendar-auth.js?v=1"></script><script src="/js/modules/calendar/calendar-provider-google.js?v=2"></script><script src="/js/modules/calendar/calendar-schedule-check.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-staff-page.js?v=5"></script><script src="/js/modules/work-schedule/work-schedule-staff-calendar-remove.js?v=2"></script>
</body></html>
