<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的玩家資料</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

    <div class="card">
        <h3>LINE 登入／找回身分</h3>
        <p>
            已連結過 LINE，可在這台手機找回 JLY Member。第一次連結時，請使用原本能看到「我的車」的瀏覽器操作。
        </p>
        <button type="button" onclick="startLineLogin()">
            使用 LINE 登入／找回我的身分
        </button>
    </div>

    <h1>👤 我的玩家資料</h1>

    <div class="card">
    <h3>📱 LINE 帳號</h3>

    <p>
        使用 LINE 登入，可以在手機或其他裝置找回你的 JLY 玩家身分。
    </p>

    <button
        type="button"
        onclick="startLineLogin()"
    >
        LINE 登入／恢復我的帳號
    </button>
</div>

    <div id="profileBox">

        <div class="card">

            <label>玩家名稱</label>

            <input
                id="displayName"
                type="text"
                placeholder="請輸入玩家名稱"
            >

            <label>預設位置</label>

            <select id="defaultPosition">
                <option>不限</option>
                <option>男位</option>
                <option>女位</option>
            </select>

            <label>

                <input
                    id="defaultCrossPlay"
                    type="checkbox"
                >

                常反串

            </label>

            <button onclick="saveMyProfile()">

                💾 建立我的玩家資料

            </button>

        </div>

    </div>

    <div
  id="systemAdminCard"
  class="card"
  hidden
>
  <h3>
    🛠 系統管理者
  </h3>

  <p
    id="systemAdminStatus"
  >
    目前身分：一般使用者
  </p>

  <button
    id="systemAdminToggleButton"
    type="button"
    onclick="toggleSystemAdminModeFromProfile()"
  >
    開啟系統管理者模式
  </button>
</div>

</div>

<button type="button" onclick="saveMyProfile()">
  💾 儲存
</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../firebase/firebase.js?v=39"></script>

<script src="../js/core/identity.js?v=1"></script>

<script src="../js/myprofile.js?v=4"></script>
<script src="../js/line.js?v=6"></script>

</body>
</html>
