<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLY Prepared View Repair</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container" style="max-width:640px;margin:32px auto;padding:20px;">
    <h1>Prepared View 指定修復</h1>
    <p>只處理已確認的 3 台車，不掃描 cars collection。</p>
    <button id="repairButton" type="button">開始修復 3 台車</button>
    <pre id="result" style="white-space:pre-wrap;margin-top:16px;"></pre>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/firebase/firebase.js?v=39"></script>
  <script src="/js/data-view/cloud-car-view.js"></script>
  <script src="/js/data-view/mycar-view.js"></script>
  <script>
    (function () {
      "use strict";
      const CAR_IDS = [
        "uqFDah47SR2CjDFBGmYc",
        "g4YSADZpZzJCJFndesQO",
        "utgCoGPqFh0GOnbSAflF"
      ];

      const button = document.getElementById("repairButton");
      const result = document.getElementById("result");

      function show(lines) {
        result.textContent = lines.join("\n");
      }

      button.addEventListener("click", async function () {
        button.disabled = true;
        const lines = ["開始指定 repair…"];
        show(lines);
        try {
          for (const carId of CAR_IDS) {
            lines.push("讀取 " + carId + "…");
            show(lines);

            // Exact document read only. syncFromCore also rewrites
            // carDetailViews/{carId} from the authoritative car document.
            const car = await window.JLYCloudCarView.syncFromCore(carId);

            // before/after are intentionally the same current Core snapshot:
            // this replaces the compact copy inside the owner's existing
            // myCarViews document without scanning Core cars.
            const myCarResults = await window.JLYMyCarView.applyCarMutation(car, car);
            lines.push("✓ " + carId + " / carDetailViews + myCarViews");
            if (Array.isArray(myCarResults) && myCarResults.length === 0) {
              lines.push("  注意：未找到可路由的 MyCar Prepared View");
            }
            show(lines);
          }
          lines.push("完成。3 台指定車已處理。");
          show(lines);
        } catch (error) {
          console.error("指定 Prepared View repair 失敗", error);
          lines.push("✗ 修復中止：" + String(error && (error.message || error) || "unknown_error"));
          show(lines);
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
