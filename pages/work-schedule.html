<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>工作班表｜JLY</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/pages/work-schedule.css?v=1">
</head><body><main class="work-schedule-page">
<header class="work-schedule-header"><div><p class="eyebrow">JLY Work Schedule</p><h1>🎭 工作班表</h1><p>先把工作記好。工作、角色、人員與時段都可新增，不綁死任何劇本或職務。</p></div><a href="/">返回首頁</a></header>
<section class="schedule-toolbar card"><div class="month-nav"><button id="prevMonth" type="button">‹</button><strong id="monthLabel">讀取中…</strong><button id="nextMonth" type="button">›</button></div><div class="view-tabs"><button type="button" data-view="all" class="active">全部班表</button><button type="button" data-view="mine">只看我的</button></div><button id="openCreate" type="button">＋ 新增／批次排班</button></section>
<section id="scheduleNotice" class="schedule-notice" hidden></section><section id="scheduleList" class="schedule-list"><div class="empty">正在讀取班表…</div></section>
<dialog id="shiftDialog"><form id="shiftForm" method="dialog"><header><h2 id="shiftDialogTitle">新增工作班次</h2><button type="button" id="closeDialog">✕</button></header><input id="editingShiftId" type="hidden"><label>工作／劇本名稱<input id="workName" required placeholder="例：孤注"></label><label>店家／地點<input id="studioName" placeholder="可先輸入文字，未來可串店家 Master"></label><div class="grid2"><label>開始時間<input id="startTime" type="time" value="11:00" required></label><label>結束時間<input id="endTime" type="time" value="18:00" required></label></div><label>角色<input id="roleName" required placeholder="例：主 G、NPC、演員"></label><label>選擇日期（可多選）<input id="shiftDates" required placeholder="2027-10-01, 2027-10-04"></label><p class="hint">批次排班可用逗號分隔多個日期。19:00 → 02:00 會自動視為跨日。</p><fieldset><legend>安排人員</legend><div id="personPicker" class="person-picker">讀取人員中…</div></fieldset><label>備註<textarea id="shiftNote" placeholder="選填"></textarea></label><div class="actions"><button type="button" id="deleteShift" class="danger" hidden>取消這筆班次</button><button type="submit">儲存班表</button></div></form></dialog>
</main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="/firebase/firebase.js?v=25"></script><script src="/js/core/identity.js?v=2"></script><script src="/js/modules/member/picker/picker-data.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule.js?v=1"></script></body></html>
