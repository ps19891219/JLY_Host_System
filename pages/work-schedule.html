<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>工作室排班｜JLY</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/pages/work-schedule.css?v=6"><link rel="stylesheet" href="../css/pages/work-schedule-staff-slots.css?v=3"><link rel="stylesheet" href="../css/pages/work-schedule-work-hub.css?v=1"><link rel="stylesheet" href="../css/pages/work-schedule-date-picker.css?v=3"><link rel="stylesheet" href="../css/pages/work-schedule-session-composer.css?v=1"></head><body><main class="work-schedule-page">
<header class="work-schedule-header"><div><p class="eyebrow">JLY Studio Work Schedule</p><h1>🎭 工作室排班</h1><p>工作室／店家管理端：管理工作、角色、可排班人員與每天實際配置。</p></div><a href="studio-detail.html?studio=kaiwei-private">返回凱崴私團</a></header>
<section class="dashboard-toolbar card"><div class="month-nav"><button id="dashboardPrev" type="button">‹</button><strong id="dashboardMonthLabel">讀取中…</strong><button id="dashboardNext" type="button">›</button></div><div class="view-tabs"><button type="button" data-dashboard-view="all" class="active">全部班表</button><button type="button" data-dashboard-view="mine">只看我的</button></div><div class="dashboard-actions"><button id="batchSelectAll" type="button">全選</button><button id="bulkBoardOpen" type="button">批次修改</button><button id="calendarRepair" type="button" disabled>補登 Google</button><button id="dashboardCreate" type="button">＋ 排班</button></div></section>
<section id="batchBar" class="batch-bar card" hidden><strong id="batchCount">已選 0 個工作日</strong><div><button id="batchAssignOpen" type="button">批次排人</button><button id="batchSync" type="button">批次同步 Google</button><button id="batchDelete" type="button">批次刪除</button><button id="batchClear" type="button" class="ghost">清除</button></div></section>
<section id="scheduleDashboard" class="schedule-dashboard"><div class="empty">正在讀取班表…</div></section>
<dialog id="bulkBoardDialog" class="bulk-board-dialog"><div class="dialog-shell"><header><div><p class="step-kicker">大量處理</p><h2>批次排班表</h2><p class="dialog-meta">一個月幾十場也可以直接在同一張表處理。</p></div><button type="button" id="bulkBoardClose" aria-label="關閉">✕</button></header><div class="bulk-controls"><label>工作<select id="bulkWork"></select></label><label>角色<select id="bulkRole"></select></label><label>人員<select id="bulkPerson" multiple size="5"></select></label><label>套用方式<select id="bulkMode"><option value="add">加入，不移除原本人員</option><option value="replace">取代這個角色目前人員</option></select></label></div><div class="bulk-tools"><button id="bulkSelectAll" type="button">全選</button><button id="bulkSelectNone" type="button">取消全選</button><button id="bulkInvert" type="button">反選</button><strong id="bulkSelectedCount">已選 0 場</strong></div><div id="bulkBoardTable" class="bulk-board-table"></div><div class="bulk-footer"><button id="bulkApply" type="button">套用到已選場次</button></div></div></dialog>
<dialog id="groupDetailDialog" class="group-detail-dialog"><div class="dialog-shell"><header><div><p class="step-kicker">工作人員</p><h2 id="groupDetailTitle"></h2><p id="groupDetailMeta" class="dialog-meta"></p></div><button type="button" id="groupDetailClose" aria-label="關閉">✕</button></header><div id="groupDetailRoles"></div><div class="group-detail-delete"><button type="button" id="groupDetailDelete">🗑 刪除這場排班</button><small>若已同步 Google Calendar，會先刪除行事曆事件，再刪除這場排班。</small></div></div></dialog>
<dialog id="batchAssignDialog" class="batch-assign-dialog"><div class="dialog-shell"><header><div><p class="step-kicker">批次處理</p><h2>批次排人</h2><p class="dialog-meta">先選角色，再勾選要套用的人員。可一次套用到多個工作日。</p></div><button type="button" id="batchAssignClose" aria-label="關閉">✕</button></header><label>角色<select id="batchAssignRole"></select></label><label>套用方式<select id="batchAssignMode"><option value="add">加入，不移除原本人員</option><option value="replace">取代這個角色目前人員</option></select></label><div id="batchAssignPeople" class="batch-assign-people"></div><button id="batchAssignApply" type="button">套用到已選日期</button></div></dialog>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="/firebase/firebase.js?v=27"></script><script src="/js/core/identity.js?v=2"></script><script src="/js/modules/member/picker/picker-data.js?v=2"></script><script src="/js/modules/calendar/calendar-config.js?v=1"></script><script src="/js/modules/calendar/calendar-auth.js?v=1"></script><script src="/js/modules/calendar/calendar-provider-google.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule-model.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-google.js?v=3"></script><script src="/js/modules/work-schedule/work-schedule-change-policy.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule-lifecycle.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-read-view.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-dashboard.js?v=7"></script><script src="/js/modules/work-schedule/work-schedule-calendar-repair.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-staff-slots.js?v=7"></script><script src="/js/modules/work-schedule/work-schedule-shift-delete.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule-work-hub.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule-date-picker.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule-session-composer.js?v=1"></script><script src="/js/modules/work-schedule/work-schedule-person-create.js?v=2"></script></body></html>
