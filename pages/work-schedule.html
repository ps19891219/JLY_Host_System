<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>工作班表｜JLY</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/pages/work-schedule.css?v=3"></head><body><main class="work-schedule-page">
<header class="work-schedule-header"><div><p class="eyebrow">JLY Work Schedule</p><h1>🎭 工作班表</h1><p>先建立這次工作的人員與角色，再用月曆批次排班。</p></div><a href="/">返回首頁</a></header>
<section class="schedule-toolbar card"><div class="month-nav"><button id="prevMonth" type="button">‹</button><strong id="monthLabel">讀取中…</strong><button id="nextMonth" type="button">›</button></div><div class="view-tabs"><button type="button" data-view="all" class="active">全部班表</button><button type="button" data-view="mine">只看我的</button></div><button id="openCreate" type="button">＋ 排班</button><button id="bulkCalendar" type="button">📅 批次加入目前顯示班次</button></section><section id="scheduleNotice" class="schedule-notice" hidden></section><section id="scheduleList" class="schedule-list"><div class="empty">正在讀取班表…</div></section>
<dialog id="shiftDialog"><form id="shiftForm"><header><div><p class="step-kicker">批次排班</p><h2>建立這次工作</h2></div><button type="button" id="closeDialog" aria-label="關閉">✕</button></header>
<label>工作／劇本名稱<input id="workName" required placeholder="例：孤注"></label><label>店家／地點<input id="studioName" placeholder="選填"></label>
<section class="setup-card"><div class="section-title"><div><strong>可排班角色與人員</strong><small>角色完全由你自訂。搜尋正式 Person；找不到時可以明確新增為訪客 Person。</small></div><button type="button" id="addRole">＋ 自訂角色</button></div><div id="rolePools"><div class="empty-mini">尚未建立角色，請按「＋ 自訂角色」。</div></div></section>
<section class="setup-card"><div class="section-title"><div><strong>📅 選擇日期</strong><small>可多選，再點一次取消。</small></div><span id="dateCount">已選 0 天</span></div><div class="calendar-nav"><button type="button" id="calPrev">‹</button><strong id="calLabel"></strong><button type="button" id="calNext">›</button></div><div class="calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="dateCalendar" class="date-calendar"></div></section>
<div class="grid2"><label>開始時間<input id="startTime" type="time" value="11:00" required></label><label>結束時間<input id="endTime" type="time" value="18:00" required></label></div>
<section class="setup-card"><div class="section-title"><div><strong>選擇要排的角色</strong><small>設定每一天需要幾個位置，再逐日點人。</small></div></div><div id="roleSelector" class="role-selector"><span class="empty-mini">請先新增角色。</span></div><label>每一天需要人數<input id="requiredCount" type="number" min="0" value="1"></label><div id="dailyAssignments" class="daily-assignments"><div class="empty-mini">請先選日期與角色。</div></div></section>
<label>備註<textarea id="shiftNote" placeholder="選填"></textarea></label><div class="actions"><button type="submit">儲存這次排班</button></div></form></dialog>
</main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="/firebase/firebase.js?v=25"></script><script src="/js/core/identity.js?v=2"></script><script src="/js/modules/member/picker/picker-data.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule.js?v=3"></script></body></html>
