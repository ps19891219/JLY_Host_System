<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE 名單核對</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.review-head{position:sticky;top:0;background:#fff;padding:14px 0;z-index:3}.review-head h2{margin:14px 0}.review-meta{font-size:14px;opacity:.72;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.summary div{padding:10px 6px;border-radius:12px;background:#f6f6f6;text-align:center}.summary strong{display:block;font-size:20px}.batch-bar{position:sticky;top:0;z-index:2;background:#fff;padding:10px 0;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.batch-bar button{flex:1;min-width:145px}.review-card{padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:16px}.review-card.is-match{border-color:#78b596}.review-card.is-diff{border-color:#d18b76}.review-title{display:flex;gap:10px;align-items:flex-start}.review-title input{width:22px;height:22px;margin-top:3px}.review-title-main{flex:1}.script-name{font-size:20px;font-weight:800;line-height:1.35}.car-sub{margin-top:3px;font-size:13px;opacity:.68}.count-row{display:flex;gap:8px;margin:12px 0}.count-box{flex:1;background:#f6f6f6;border-radius:12px;padding:10px;text-align:center}.count-box strong{display:block;font-size:21px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-top:5px}.badge-match{background:#e9f5ee;color:#28704b}.badge-diff{background:#fff0eb;color:#9a4934}.roster{margin:10px 0;padding:12px;background:#fafafa;border-radius:12px;line-height:1.7}.roster strong{display:block;margin-bottom:3px}.roster-names{font-size:14px}.review-delta{margin:10px 0;padding:10px;background:#f6f6f6;border-radius:10px;font-size:14px}.review-actions{display:flex;gap:8px}.review-actions button{flex:1}.technical{margin-top:10px;font-size:12px;opacity:.62}.technical summary{cursor:pointer}.empty{padding:28px 12px;text-align:center;opacity:.7}.diagnostic{margin:12px 0;padding:14px;background:#f6f6f6;border-radius:12px;line-height:1.7;font-size:14px}.diagnostic strong{display:block;margin-bottom:4px}@media(max-width:420px){.summary{grid-template-columns:repeat(3,1fr)}.review-actions{flex-direction:column}}
</style>
</head>
<body><div class="container">
<div class="review-head"><button type="button" onclick="location.href='../index.html'">← 回首頁</button><h2>LINE 群組名單核對</h2><button id="catchupButton" type="button">補抓已綁定群組（最多 10 個）</button></div>
<div id="reviewStatus" class="review-meta"></div><div id="reviewSummary"></div><div id="catchupDiagnostic"></div><div id="batchBar"></div><div id="reviewList"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/firebase/firebase.js?v=24"></script><script src="/js/core/identity.js?v=2"></script>
<script>
"use strict";
let reviewRows=[];
function ownerId(){return String(window.JLYIdentity&&window.JLYIdentity.getCurrentPlayerId?window.JLYIdentity.getCurrentPlayerId():localStorage.getItem("currentPlayerId")||"").trim();}
function esc(v){return String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function text(v){return String(v==null?"":v).trim();}
function activePlayers(car){return (Array.isArray(car&&car.players)?car.players:[]).filter(p=>{const s=text(p&&p.status).toLowerCase();return !["已取消","取消","cancelled","canceled"].includes(s);});}
function playerName(p){return text(p&&p.hostAlias)||text(p&&p.playerName)||text(p&&p.displayName)||text(p&&p.name)||"未命名";}
function scriptName(car){return text(car&&car.scriptName)||text(car&&car.title)||text(car&&car.name)||"未命名劇本";}
function carDate(car){const d=text(car&&car.gameDate)||text(car&&car.date),t=text(car&&car.gameTime)||text(car&&car.time);return [d,t].filter(Boolean).join(" ");}
function carPlace(car){return text(car&&car.organizerName)||text(car&&car.locationName)||text(car&&car.studioName);}
function lineNames(row){const raw=row.lineMembers||row.members||row.memberProfiles||row.lineMemberProfiles||[];return Array.isArray(raw)?raw.map(x=>typeof x==="string"?x:(x.displayName||x.name||x.lineDisplayName||"")).map(text).filter(Boolean):[];}
function isCountMatch(row){return row.carPlayerCount===row.lineCount;}
async function api(payload){const r=await fetch("/api/line-group-pairing-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.error||"request_failed");return data;}
async function getCars(ids){const unique=[...new Set(ids.filter(Boolean))];const pairs=await Promise.all(unique.map(async id=>{try{const d=await window.db.collection("cars").doc(id).get();return [id,d.exists?{id:d.id,...d.data()}:null];}catch(_){return [id,null];}}));return Object.fromEntries(pairs);}
function renderSummary(){const total=reviewRows.length,match=reviewRows.filter(isCountMatch).length,diff=total-match;document.getElementById("reviewSummary").innerHTML=total?`<div class="summary"><div><strong>${total}</strong>待核對</div><div><strong>${match}</strong>人數一致</div><div><strong>${diff}</strong>人數不同</div></div>`:"";}
function selectedRows(){const ids=[...document.querySelectorAll('.review-check:checked')].map(x=>x.dataset.group);return reviewRows.filter(r=>ids.includes(r.groupKey));}
function updateBatchLabel(){const rows=selectedRows(),btn=document.getElementById("verifySelected");if(btn)btn.textContent=`批次確認${rows.length?`（${rows.length} 團）`:""}`;}
function renderBatch(){const matchCount=reviewRows.filter(isCountMatch).length;document.getElementById("batchBar").innerHTML=reviewRows.length?`<div class="batch-bar"><button type="button" id="selectMatches">選取人數一致（${matchCount}）</button><button type="button" id="verifySelected">批次確認</button></div>`:"";const s=document.getElementById("selectMatches"),v=document.getElementById("verifySelected");if(s)s.onclick=()=>{document.querySelectorAll('.review-check').forEach(c=>{const row=reviewRows.find(r=>r.groupKey===c.dataset.group);c.checked=!!row&&isCountMatch(row);});updateBatchLabel();};if(v)v.onclick=verifySelected;}
function renderCard(row){const car=row.car||{},players=activePlayers(car),names=players.map(playerName),ln=lineNames(row),match=isCountMatch(row),date=carDate(car),place=carPlace(car),joined=(row.pendingJoinedUserIds||[]).length,left=(row.pendingLeftUserIds||[]).length;return `<div class="review-card ${match?'is-match':'is-diff'}"><div class="review-title"><input class="review-check" type="checkbox" data-group="${esc(row.groupKey)}" aria-label="選取 ${esc(scriptName(car))}"><div class="review-title-main"><div class="script-name">${esc(scriptName(car))}</div><div class="car-sub">${esc([date,place].filter(Boolean).join(" ・ ")||"車團資料未填日期／店家")}</div><span class="badge ${match?'badge-match':'badge-diff'}">${match?'人數一致，待確認':'人數不同，優先核對'}</span></div></div><div class="count-row"><div class="count-box">車團<strong>${row.carPlayerCount}</strong>人</div><div class="count-box">LINE<strong>${row.lineCount}</strong>人</div><div class="count-box">差異<strong>${row.lineCount-row.carPlayerCount>0?'+':''}${row.lineCount-row.carPlayerCount}</strong>人</div></div><div class="roster"><strong>車團名單</strong><div class="roster-names">${names.length?names.map(esc).join('、'):'目前沒有正式玩家'}</div></div><div class="roster"><strong>LINE 名單</strong><div class="roster-names">${ln.length?ln.map(esc).join('、'):`目前只能取得 LINE 人數（${row.lineCount} 人），LINE 尚未提供可顯示的成員姓名。`}</div></div><div class="review-delta">加入異動：${joined} 人　｜　退出異動：${left} 人${joined&&left?"<br>⚠️ 總人數即使相同，也可能有人員交換，仍需核對。":""}</div><div class="review-actions"><button type="button" onclick="location.href='car-detail.html?id=${encodeURIComponent(row.carId||'')}'">查看車團</button><button type="button" onclick="verifyOne('${esc(row.carId)}','${esc(row.groupId)}')">確認這團</button></div><details class="technical"><summary>技術資料</summary>車團 ID：${esc(row.carId)}<br>LINE Group ID：${esc(row.groupId)}<br>最後異動：${esc(row.lastEventAt||row.initializedAt||"")}</details></div>`;}
async function render(){const id=ownerId(),list=document.getElementById("reviewList"),status=document.getElementById("reviewStatus");if(!id){status.textContent="請先登入 JLY。";return;}status.textContent="讀取待核對名單與車團資料…";try{const snap=await window.db.collection("lineGroupMembershipSnapshots").where("ownerId","==",id).get();const raw=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==="needs_review");const cars=await getCars(raw.map(x=>text(x.carId)));reviewRows=raw.map(x=>{const car=cars[text(x.carId)]||null;return {...x,car,groupId:text(x.groupId||x.id),groupKey:text(x.groupId||x.id),lineCount:Number(x.lineMemberCount)||0,carPlayerCount:activePlayers(car).length};}).sort((a,b)=>Number(isCountMatch(a))-Number(isCountMatch(b)));status.textContent=reviewRows.length?`目前 ${reviewRows.length} 個群組需要處理。人數不同的已排在前面；人數一致可批次選取確認。`:"目前沒有待核對的 LINE 群組。";renderSummary();renderBatch();list.innerHTML=reviewRows.length?reviewRows.map(renderCard).join(""):"<div class=\"empty\">目前沒有待核對項目。若剛加入小助手，請按上方「補抓已綁定群組」。</div>";document.querySelectorAll('.review-check').forEach(c=>c.addEventListener('change',updateBatchLabel));}catch(e){console.error(e);status.textContent="名單提醒讀取失敗。";}}
async function verifyOne(carId,groupId){if(!confirm("確認目前 LINE 群組與車團名單已核對完成？\n\n這只會標記核對完成，不會修改正式車團名單。"))return;try{await api({action:"verify",carId,groupId});await render();}catch(e){alert("確認失敗，請稍後再試。");}}
async function verifySelected(){const rows=selectedRows();if(!rows.length){alert("請先勾選要確認的群組。");return;}if(!confirm(`確定批次確認 ${rows.length} 個群組？\n\n這只會標記核對完成，不會修改正式車團名單。`))return;const btn=document.getElementById("verifySelected");btn.disabled=true;let ok=0,failed=0;for(const row of rows){try{await api({action:"verify",carId:row.carId,groupId:row.groupId});ok++;}catch(_){failed++;}}alert(failed?`完成 ${ok} 團，${failed} 團確認失敗，會保留在清單中。`:`已完成 ${ok} 團批次確認。`);await render();}
function showDiagnostic(result){const d=result.diagnostics||{};document.getElementById("catchupDiagnostic").innerHTML=`<div class="diagnostic"><strong>這次補抓檢查結果</strong>掃描有效綁定：${Number(d.activeBindingsScanned)||0}<br>成功建立待核對：${Number(d.initialized)||0}<br>已有名單快照：${Number(d.existingSnapshots)||0}<br>已過期車團：${Number(d.expiredCars)||0}<br>找不到車團：${Number(d.missingCars)||0}<br>目前登入身分不是車主：${Number(d.notOwnedByCurrentIdentity)||0}<br>LINE 名單抓取失敗：${Number(d.initializationFailed)||0}</div>`;}
document.getElementById("catchupButton").addEventListener("click",async function(){this.disabled=true;document.getElementById("reviewStatus").textContent="正在補抓目前有效、已綁定但尚未初始化的群組…";try{const result=await api({action:"catchup",limit:10});showDiagnostic(result);await render();}catch(e){alert("補抓失敗，請確認已登入後再試。");}finally{this.disabled=false;}});
document.addEventListener("DOMContentLoaded",render);
</script></body></html>
