<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE 名單核對</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.review-head{position:sticky;top:0;background:#fff;padding:14px 0;z-index:3}.review-head h2{margin:14px 0}.review-meta{font-size:14px;opacity:.72;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.summary div{padding:10px 6px;border-radius:12px;background:#f6f6f6;text-align:center}.summary strong{display:block;font-size:20px}.batch-bar{position:sticky;top:0;z-index:2;background:#fff;padding:10px 0;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.batch-bar button{flex:1;min-width:145px}.review-card{padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:16px}.review-card.is-match{border-color:#78b596}.review-card.is-diff{border-color:#d18b76}.review-title{display:flex;gap:10px;align-items:flex-start}.review-title input{width:22px;height:22px;margin-top:3px}.review-title-main{flex:1}.script-name{font-size:20px;font-weight:800;line-height:1.35}.car-sub{margin-top:3px;font-size:13px;opacity:.68}.count-row{display:flex;gap:8px;margin:12px 0}.count-box{flex:1;background:#f6f6f6;border-radius:12px;padding:10px;text-align:center}.count-box strong{display:block;font-size:21px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-top:5px}.badge-match{background:#e9f5ee;color:#28704b}.badge-diff{background:#fff0eb;color:#9a4934}.roster{margin:10px 0;padding:12px;background:#fafafa;border-radius:12px;line-height:1.7}.roster strong{display:block;margin-bottom:3px}.roster-names{font-size:14px}.review-delta{margin:10px 0;padding:10px;background:#f6f6f6;border-radius:10px;font-size:14px}.review-actions{display:flex;gap:8px}.review-actions button{flex:1}.empty{padding:28px 12px;text-align:center;opacity:.7}.diagnostic{margin:12px 0;padding:14px;background:#f6f6f6;border-radius:12px;line-height:1.7;font-size:14px}.diagnostic strong{display:block;margin-bottom:4px}@media(max-width:420px){.summary{grid-template-columns:repeat(3,1fr)}.review-actions{flex-direction:column}}
</style>
</head>
<body><div class="container">
<div class="review-head"><button type="button" onclick="location.href='../index.html'">← 回首頁</button><h2>LINE 群組名單核對</h2><button id="catchupButton" type="button">補抓已綁定群組（最多 10 個）</button></div>
<div id="reviewStatus" class="review-meta"></div><div id="reviewSummary"></div><div id="catchupDiagnostic"></div><div id="batchBar"></div><div id="reviewList"></div>
</div>

<script src="/firebase/firebase.js?v=24"></script><script src="/js/core/identity.js?v=2"></script><script src="/js/line/membership-review-page.js?v=4"></script>
</body></html>
