<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>劇本管理｜JLY 工作室</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container">
    <div class="hero">
      <div class="jelly">🎭</div>
      <h1>劇本管理</h1>
      <p>凱崴私團</p>
    </div>

    <div class="card">
      <h2>工作室劇本</h2>
      <p>這裡管理工作室上架與維護的劇本資料，例如名稱、封面、簡介、人數配置、時長與標籤。排班表只引用劇本，不在這裡處理每天的人員配置。</p>
    </div>

    <div class="card">
      <h2>Script Master 接軌中</h2>
      <p>本頁先建立正式責任入口。劇本資料會接既有 JLY Script Master 規劃，不把 Work Schedule 的 Work 當成第二套劇本資料庫。</p>
    </div>

    <button type="button" style="width:100%;" disabled>＋ 新增劇本（下一階段接 Script Master）</button>
    <button type="button" class="gray" style="width:100%;margin-top:12px;" onclick="location.href='studio-detail.html?studio=kaiwei-private'">← 返回凱崴私團</button>
  </main>
</body>
</html>
