<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修復新月舊事｜JLY</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;margin:0;padding:24px}.card{max-width:520px;margin:12vh auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#222;color:#fff}button:disabled{opacity:.55}#result{margin-top:16px;line-height:1.6;white-space:pre-wrap}</style></head><body><main class="card"><h2>🌙 新月舊事｜我的揪團修復</h2><p>只會修復你目前登入帳號名下的「新月舊事」，不會掃描或修改其他車團。</p><button id="run">修復「新月舊事」</button><div id="result"></div></main><script>const b=document.getElementById("run"),r=document.getElementById("result");b.onclick=async()=>{b.disabled=true;r.textContent="修復中…";try{const x=await fetch("/api/maintenance-repair-xinyue-mycar",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({confirm:"REPAIR_XINYUE_MY_CAR"})});const d=await x.json();if(!x.ok)throw new Error(d.error||"修復失敗");r.textContent="✅ 已完成！「新月舊事」已補回我的揪團。\n現在可以回到「我的車」重新整理查看。";b.textContent="修復完成";}catch(e){r.textContent="❌ 尚未完成："+e.message+"\n如果顯示 member_session_required，請先從 LINE 小助手登入 JLY 後再開此頁。";b.disabled=false;}};</script></body></html>
