<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的遊玩紀錄｜JLY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#222a38;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:640px;margin:auto;padding:16px}h1{font-size:24px}.muted{font-size:12px;color:#697386}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat,.panel,.card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 1px 5px #0000000a}.stat b{display:block;font-size:22px}.stat small{font-size:11px;color:#687083}.bar{display:flex;gap:8px;margin:12px 0}button,input,select,textarea{font:inherit;border:1px solid #dce0e8;border-radius:9px;padding:9px;min-width:0}button{background:white;cursor:pointer}.primary,.active{background:#28324a;color:#fff}input[type=search]{width:100%}.tabs button{flex:1;font-size:13px}.panel{margin:12px 0}.card{display:flex;gap:12px;align-items:center;margin:9px 0}.book{background:#eef0f7;border-radius:10px;padding:12px}.main{flex:1;min-width:0}.name{font-weight:650;overflow-wrap:anywhere}.date{border:0;background:#f2f4f8;color:#5a6575;font-size:13px;margin:6px 0;padding:5px}.missing{color:#a16207}.badge{background:#eef0f7;border-radius:12px;padding:5px;font-size:12px}textarea{width:100%;height:110px;font:12px monospace}dialog{border:0;border-radius:15px;width:min(360px,90%);padding:20px}dialog::backdrop{background:#0007}dialog input{width:100%;margin:12px 0}dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0}a{color:#2b4c80}
</style></head><body><main class="wrap"><p><a href="./myprofile.html">← 返回我的玩家資料</a></p><h1>📖 我的遊玩紀錄</h1><p class="muted">測試功能：資料僅存在此瀏覽器，尚未寫入 Firestore。更換裝置不會同步，請定期匯出備份。</p>
<div class="panel"><button id="loadCars" type="button">↻ 讀取我的車（唯讀）</button><p id="carStatus" class="muted">尚未讀取我的車。僅讀取現有 Prepared View，不修改車團。</p></div><section class="stats"><div class="stat"><small>累積遊玩</small><b id="total">0</b><small>場</small></div><div class="stat"><small>不同劇本</small><b id="unique">0</b><small>本</small></div><div class="stat"><small>日期待補</small><b id="missing">0</b><small>場</small></div></section><div class="panel"><b>🗓️ 待遊玩</b><span id="upcomingCount" style="float:right">0 場</span><div id="upcomingList" class="muted"></div></div>
<div class="panel"><b>🔎 待確認車團</b><span id="carReviewCount" style="float:right">0 場</span><div id="carReviewList" class="muted"></div></div><div class="panel"><button id="toggle" aria-expanded="false" style="width:100%;text-align:left">＋ 批次匯入 <span id="arrow" style="float:right">展開 ▾</span></button><div id="importFields" hidden><p class="muted">貼上試算表複製的 Tab 分隔資料。每一列代表一場，匯入前會先確認。</p><textarea id="paste" placeholder="日期　時間　主揪　…　劇本名稱…"></textarea><div class="bar"><button class="primary" id="import">匯入貼上資料</button><input id="file" type="file" accept=".tsv,.csv,.txt" aria-label="選擇檔案"></div></div><div class="bar"><button id="export">匯出 CSV 備份</button><button id="clear">清除測試資料</button></div><p id="status" class="muted"></p></div>
<input id="search" type="search" placeholder="搜尋劇本名稱…"><div class="bar tabs" id="tabs"><button class="active" data-tab="all">全部</button><button data-tab="dated">有日期</button><button data-tab="missing">待補日期</button></div><div class="bar"><select id="sort"><option value="new">日期由近至遠</option><option value="old">日期由遠至近</option><option value="name">劇本名稱</option></select><span id="count" class="muted" style="margin:auto 0 auto auto"></span></div><div id="list"></div>
</main><dialog id="rosterEditor"><h3 id="rosterTitle">補登當場車友</h3><p class="muted">每行一位車友暱稱。只記錄當時稱呼，不自動認領或建立新 Person。</p><textarea id="rosterInput" placeholder="一行一位，例如：小明"></textarea><p class="muted">測試階段僅儲存在此瀏覽器，不會修改我的車正式人員名單。</p><menu><button type="button" id="rosterCancel">取消</button><button type="button" class="primary" id="rosterSave">儲存補登</button></menu></dialog><dialog id="editor"><form method="dialog" id="dateForm"><h3 id="editTitle">修改遊玩日期</h3><label for="dateInput">遊玩日期</label><input type="date" id="dateInput"><p class="muted">清空日期可恢復「日期待補」。</p><menu><button type="button" id="cancel">取消</button><button class="primary" value="save">儲存</button></menu></form></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../firebase/firebase.js?v=39"></script><script src="../js/core/identity.js?v=1"></script><script>
'use strict';
const key='jly-play-history-preview-v1', $=id=>document.getElementById(id);
let rows=[];try{const v=JSON.parse(localStorage.getItem(key)||'[]');rows=Array.isArray(v)?v:[]}catch(e){}
let tab='all',editing=null,rosterEditing=null,carPlayed=[],carUpcoming=[],carUnverified=[];
const rosterKey='jly-play-history-roster-notes-v1';let rosterNotes={};try{const v=JSON.parse(localStorage.getItem(rosterKey)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))rosterNotes=v}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normDate(s){const m=String(s||'').trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(!m)return '';const y=+m[1],mo=+m[2],d=+m[3],v=new Date(Date.UTC(y,mo-1,d));return v.getUTCFullYear()===y&&v.getUTCMonth()===mo-1&&v.getUTCDate()===d?[y,String(mo).padStart(2,'0'),String(d).padStart(2,'0')].join('-'):''}
function titleKey(s){return String(s||'').trim().replace(/[（(]\s*(?:[一二三四五六七八九十]|\d+)刷\s*[)）]$/,'').replace(/\s+/g,'').toLowerCase()}
function save(){localStorage.setItem(key,JSON.stringify(rows));render()}
function rosterFor(x){return Array.isArray(rosterNotes[x.id])?rosterNotes[x.id]:[]}
function saveRosterNotes(){localStorage.setItem(rosterKey,JSON.stringify(rosterNotes));render()}
function allPlayed(){const imported=rows.slice();const matched=new Set();const added=[];for(const car of carPlayed){const i=imported.findIndex((x,j)=>!matched.has(j)&&titleKey(x.name)===titleKey(car.name)&&x.date===car.date);if(i>=0){matched.add(i)}else added.push(car)}return imported.concat(added)}
function render(){ const played=allPlayed();$('total').textContent=played.length;$('unique').textContent=new Set(played.map(x=>titleKey(x.name))).size;$('missing').textContent=played.filter(x=>!x.date).length;$('upcomingCount').textContent=carUpcoming.length+' 場';$('upcomingList').innerHTML=carUpcoming.length?carUpcoming.map(x=>'<div style="padding:8px 0;border-top:1px solid #eee">'+esc(x.date)+' · '+esc(x.name)+'</div>').join('') :'目前沒有讀取到待遊玩的玩家車團';$('carReviewCount').textContent=carUnverified.length+' 場';$('carReviewList').innerHTML=carUnverified.length?carUnverified.map(x=>'<div style="padding:8px 0;border-top:1px solid #eee">'+esc(x.date||'日期未定')+' · '+esc(x.name)+' · '+esc(x.reason)+'</div>').join(''):'目前沒有需要確認的車團';
const ordered=played.filter(x=>x.date).slice().sort((a,b)=>a.date.localeCompare(b.date)||String(a.time||'').localeCompare(String(b.time||'')));
const ranks=new Map();for(let i=0;i<ordered.length;i++){const x=ordered[i],same=ordered.filter(y=>y.date===x.date&&(!x.time||!y.time||x.time===y.time));if(same.length===1)ranks.set(x.id,i+1)}
const q=$('search').value.trim().toLowerCase();let a=played.filter(x=>String(x.name).toLowerCase().includes(q)&&(tab==='all'||(tab==='dated'?!!x.date:!x.date))),sort=$('sort').value;
a.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name,'zh-Hant'):(x.date&&y.date?(sort==='new'?y.date.localeCompare(x.date):x.date.localeCompare(y.date))||(sort==='new'?String(y.time||'').localeCompare(String(x.time||'')):String(x.time||'').localeCompare(String(y.time||''))):x.date?-1:y.date?1:0));
$('count').textContent='顯示 '+a.length+' 筆';
$('list').innerHTML=a.length?a.map(x=>{const n=played.filter(y=>titleKey(y.name)===titleKey(x.name)).length;const rank=ranks.get(x.id),names=rosterFor(x);return '<article class="card"><div class="book">📖</div><div class="main"><div class="name">'+esc(x.name)+'</div>'+(rank?'<div class="muted">已知日期第 '+rank+' 場</div>':'')+'<button class="date '+(!x.date?'missing':'')+'" '+(x.source==='car'?'disabled title="車團日期請至我的車修改"':'data-edit="'+esc(x.id)+'"')+'>📅 '+(x.date?esc(x.date):'日期待補，點此修改')+' ✎</button><div class="muted">'+esc(x.place||'地點未記錄')+(x.source==='car'?' · 來自我的車':'')+(x.time?' · '+esc(x.time):'')+'</div><div class="muted">車友補登：'+(names.length?esc(names.join('、')):'尚未補登')+'</div><button type="button" data-roster="'+esc(x.id)+'">✎ 補車友</button></div>'+(n>1?'<span class="badge">共 '+n+' 場</span>':'')+'</article>'}).join(''):'<div class="panel muted">沒有符合條件的紀錄</div>'}
async function loadCars(){
 const status=$('carStatus');status.textContent='讀取中…';
 try{
  if(!window.db)throw Error('Firebase 尚未初始化');
  const identity=window.JLYIdentity;
  const id=String(identity&&identity.getCurrentPlayerId?identity.getCurrentPlayerId():localStorage.getItem('currentPlayerId')||'').trim();
  if(!id)throw Error('請先登入或恢復玩家身分');
  let snap=await window.db.collection('myCarViews').doc(id).get();
  if(!snap.exists){
   const alias=await window.db.collection('myCarViewAliases').doc(id).get();
   const target=alias.exists?String((alias.data()||{}).viewerId||'').trim():'';
   if(target&&target!==id)snap=await window.db.collection('myCarViews').doc(target).get();
  }
  if(!snap.exists)throw Error('找不到目前身分的 MyCar Prepared View，請先開啟我的車確認資料');
  const view=snap.data()||{};
  if(!Array.isArray(view.cars))throw Error('MyCar Prepared View 格式不正確');
  const linkedIds=new Set([id,...(Array.isArray(view.identityIds)?view.identityIds:[]),...(identity&&identity.getAllPlayerIdentityIds?identity.getAllPlayerIdentityIds():[])].map(x=>String(x||'').trim()).filter(Boolean));
  const now=new Date(),played=[],upcoming=[],unverified=[];
  const cancelled=new Set(['已取消','取消','cancelled','canceled','removed','退出','已退出','已移除','拒絕','rejected']);
  const pending=new Set(['待審核','審核中','pending','waiting','候補','waitlisted']);
  for(const car of view.cars){
   if(!car.scriptName||cancelled.has(String(car.status||'').toLowerCase()))continue;
   const roster=Array.isArray(car.players)?car.players:[];
   const member=roster.find(p=>linkedIds.has(String(p.playerId||'').trim()));
   if(!member)continue;
   const memberStatus=String(member.status||'').trim().toLowerCase();
   if(cancelled.has(memberStatus))continue;
   const date=normDate(car.gameDate);
   const record={id:'car:'+car.id,source:'car',name:car.scriptName,date,time:car.gameTime||'',place:car.locationName||car.location||car.studioName||''};
   if(pending.has(memberStatus)){unverified.push({...record,reason:'名單尚未核准'});continue}
   if(!date){unverified.push({...record,reason:'車團日期未確認'});continue}
   const rawTime=String(car.gameTime||'').trim();
   const validTime=/^([01]?\d|2[0-3]):[0-5]\d$/.test(rawTime);
   const when=new Date(date+'T'+(validTime?rawTime.padStart(5,'0'):'23:59')+':00');
   if(Number.isNaN(when.getTime())){unverified.push({...record,reason:'時間格式待確認'});continue}
   if(when<now)played.push(record);else upcoming.push(record);
  }
  upcoming.sort((a,b)=>a.date.localeCompare(b.date));
  carPlayed=played;carUpcoming=upcoming;carUnverified=unverified;
  status.textContent='已讀取：已過時間 '+played.length+' 場、待遊玩 '+upcoming.length+' 場、待確認 '+unverified.length+' 場（唯讀）';
  render();
 }catch(e){status.textContent='無法讀取：'+e.message}
}
$('loadCars').onclick=loadCars;
function fingerprint(x){return [x.name,x.rawDate||x.date,x.time,x.place].map(v=>String(v||'').trim()).join('|')}
function addUnique(a){const existing=new Map();for(const x of rows){const k=fingerprint(x);if(!existing.has(k))existing.set(k,[]);existing.get(k).push(x)}const seen=new Map(),fresh=[];for(const x of a){const k=fingerprint(x),count=seen.get(k)||0;seen.set(k,count+1);const previous=(existing.get(k)||[])[count];if(previous){if(x.roster&&x.roster.length&&!rosterFor(previous).length)rosterNotes[previous.id]=x.roster}else{fresh.push(x);if(x.roster&&x.roster.length)rosterNotes[x.id]=x.roster}}rows.push(...fresh);localStorage.setItem(rosterKey,JSON.stringify(rosterNotes));save();return fresh.length}
function csvFields(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function parse(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),out=[];const first=lines[0]||'';const delimiter=first.includes('\t')?'tab':'csv';const header=(delimiter==='tab'?first.split('\t'):csvFields(first)).map(x=>x.trim());const index=label=>header.indexOf(label);const exported=index('劇本名稱')>=0&&index('原始日期')>=0;for(const line of lines){const c=delimiter==='tab'?line.split('\t'):csvFields(line);if(c.some(x=>x.trim()==='劇本名稱'))continue;let raw='',time='',name='',place='',date='';if(exported){date=c[index('日期')]||'';raw=c[index('原始日期')]||'';time=c[index('時間')]||'';name=c[index('劇本名稱')]||'';place=c[index('地點')]||''}else if(c.length>=5){raw=c[0];time=c[1];name=c[4];place=c[8]||c[9]||''}else if(c.length>=2){raw=c[0];name=c[1];place=c[2]||''}name=String(name||'').trim();if(!name)continue;out.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2),name,date:exported?normDate(date):normDate(raw),rawDate:String(raw||'').trim(),time:String(time||'').trim(),place:String(place||'').trim(),roster:exported&&index('車友補登')>=0?String(c[index('車友補登')]||'').split('、').map(x=>x.trim()).filter(Boolean):[]})}return out}
$('toggle').onclick=()=>{const opened=$('toggle').getAttribute('aria-expanded')==='true';$('toggle').setAttribute('aria-expanded',String(!opened));$('importFields').hidden=opened;$('arrow').textContent=opened?'展開 ▾':'收合 ▴'};
$('import').onclick=()=>{const a=parse($('paste').value);if(!a.length){$('status').textContent='沒有找到有效的劇本資料';return}if(!confirm('檢查到 '+a.length+' 筆資料，會比對既有筆數，保留同劇本的重刷場次，確定匯入嗎？'))return;const invalid=a.filter(x=>x.rawDate&&!x.date&&!normDate(x.rawDate));const added=addUnique(a);$('paste').value='';$('status').textContent='已新增 '+added+' 場，略過 '+(a.length-added)+' 筆已存在紀錄'+(invalid.length?'；'+invalid.length+' 筆日期格式待確認':'')+'（僅此瀏覽器）'};
$('file').onchange=async e=>{const f=e.target.files[0];if(f)$('paste').value=await f.text()};
$('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()};
$('search').oninput=render;$('sort').onchange=render;
$('list').onclick=e=>{const rb=e.target.closest('[data-roster]');if(rb){rosterEditing=allPlayed().find(x=>x.id===rb.dataset.roster);if(!rosterEditing)return;$('rosterTitle').textContent=rosterEditing.name+' · 補登當場車友';$('rosterInput').value=rosterFor(rosterEditing).join('\n');$('rosterEditor').showModal();return}const b=e.target.closest('[data-edit]');if(!b)return;editing=rows.find(x=>x.id===b.dataset.edit);if(!editing)return;$('editTitle').textContent=editing.name+' · 修改日期';$('dateInput').value=editing.date;$('editor').showModal()};
$('rosterCancel').onclick=()=>$('rosterEditor').close();$('rosterSave').onclick=()=>{if(!rosterEditing)return;const names=$('rosterInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);rosterNotes[rosterEditing.id]=names;saveRosterNotes();$('rosterEditor').close()};$('cancel').onclick=()=>$('editor').close();$('dateForm').onsubmit=e=>{if(e.submitter?.value==='save'&&editing){editing.date=$('dateInput').value;save()}};
$('clear').onclick=()=>{if(confirm('確定清除本瀏覽器的測試資料與車友補登？')){rows=[];rosterNotes={};localStorage.removeItem(rosterKey);save()}};
$('export').onclick=()=>{const data=[['日期','時間','劇本名稱','地點','原始日期','車友補登'],...rows.map(x=>[x.date,x.time,x.name,x.place,x.rawDate,rosterFor(x).join('、')])],csv='\uFEFF'+data.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='JLY-遊玩紀錄-測試備份.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
