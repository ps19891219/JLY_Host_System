<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作室營運中心｜JLY</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f7f7f8;color:#222}.wrap{max-width:760px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:16px;margin-bottom:12px}.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.count{background:#f5f5f7;border-radius:14px;padding:12px}.count strong{font-size:24px;display:block}.section h2{font-size:17px}.task{background:#fff;border:1px solid #ececef;border-radius:14px;padding:13px;margin:8px 0;width:100%;text-align:left}.muted{color:#777;font-size:13px}.empty{padding:18px;text-align:center;color:#777}dialog{border:0;border-radius:18px;max-width:520px;width:calc(100% - 36px);padding:18px}dialog::backdrop{background:#0005}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button{padding:10px 12px;border-radius:12px;border:1px solid #ddd;background:#fff}.actions .primary{background:#222;color:#fff}.close{float:right}</style></head><body><main class="wrap"><section class="hero"><h1>工作室營運中心</h1><p class="muted">待辦列表只讀已整理好的資料；實際操作交回原本的 Booking、Activity、Employee domain。</p><div class="counts" id="counts"></div><div class="actions"><button id="openBookings" type="button">📨 預約管理</button><button id="openSchedule" type="button">📅 工作室排班</button></div><p class="muted" id="operationsLoadState">正在讀取已整理的待辦資料…</p></section><div id="sections"></div></main><dialog id="taskDialog"><button class="close" id="closeTask">關閉</button><h2 id="taskTitle"></h2><p class="muted" id="taskSubtitle"></p><div class="actions" id="taskActions"></div><p class="muted" id="taskPermission"></p></dialog><script src="../js/modules/studio/studio-operations.js"></script><script src="../js/modules/studio/studio-operations-adapter.js"></script><script src="../js/modules/studio/studio-operations-actions.js"></script><script src="../js/modules/studio/studio-operations-view-model.js"></script><script src="../js/modules/studio/studio-operations-task-ui.js"></script><script>(function(){const VM=window.JLYStudioOperationsViewModel,U=window.JLYStudioOperationsTaskUI;let current={items:[]},membership=null;const labels={accept:'接受訂場',reject:'拒絕',propose_adjustment:'提出調整',approve:'同意申請',open_schedule:'前往排班',invite_replacement:'找替代人員',withdraw_tentative:'撤回暫定安排',open_recruitment:'查看揪團'};function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openTask(id){const t=current.items.find(x=>x.id===id);if(!t)return;taskTitle.textContent=t.title||'待處理';taskSubtitle.textContent=t.subtitle||'';const aa=U.allowedActions(t,membership);taskActions.innerHTML=aa.map(a=>'<button data-action="'+esc(a)+'" class="'+(a==='accept'||a==='approve'?'primary':'')+'">'+esc(labels[a]||a)+'</button>').join('');taskPermission.textContent=aa.length?'':'目前身分可查看，但沒有處理這筆事項的權限。';taskActions.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>window.dispatchEvent(new CustomEvent('jly:studio-operation-command',{detail:{task:t,action:b.dataset.action,command:U.command(t,b.dataset.action)}})));taskDialog.showModal()}function render(view,member){current=view||{items:[]};membership=member||null;const items=Array.isArray(current.items)?current.items:[],s=VM.summary(items),g=VM.group(items);counts.innerHTML=[['待處理',s.total],['訂場',s.booking],['場次異動',s.activity],['員工',s.staff]].map(x=>'<div class="count"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('');const defs=[['booking','訂場'],['activity','場次／主揪異動'],['staff','員工排班'],['recruitment','揪團'],['other','其他']];sections.innerHTML=defs.filter(d=>g[d[0]].length).map(d=>'<section class="section card"><h2>'+d[1]+'</h2>'+g[d[0]].map(x=>'<button class="task" data-task-id="'+esc(x.id)+'"><strong>'+esc(x.title)+'</strong>'+(x.subtitle?'<div class="muted">'+esc(x.subtitle)+'</div>':'')+'</button>').join('')+'</section>').join('')||'<div class="card empty">目前沒有待處理事項。</div>';sections.querySelectorAll('[data-task-id]').forEach(b=>b.onclick=()=>openTask(b.dataset.taskId))}closeTask.onclick=()=>taskDialog.close();window.JLYStudioOperationsPage={render};
const studioId=String(new URLSearchParams(location.search).get('studio')||'kaiwei-private').trim();
openBookings.onclick=()=>location.href='studio-bookings.html?studio='+encodeURIComponent(studioId);
openSchedule.onclick=()=>location.href='work-schedule.html?studio='+encodeURIComponent(studioId);
async function loadPrepared(){
 const A=window.JLYStudioOperationsAdapter;
 if(!A)throw new Error('studio_operations_dependencies_missing');
 const res=await fetch('/api/studio-operations-context?studio='+encodeURIComponent(studioId),{headers:{Accept:'application/json'},cache:'no-store'});
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw new Error(data.error||'studio_operations_context_failed');
 const prepared=A.combine({studioId,bookingInbox:data.bookingInbox||{},pendingActions:Array.isArray(data.pendingActions)?data.pendingActions:[]});
 render(prepared,data.membership||null);
 operationsLoadState.textContent='已讀取工作室 Prepared Views。清單不掃描 Booking、Activity、Work Schedule 正式資料。';
}
render({items:[]},null);
loadPrepared().catch(e=>{console.error(e);operationsLoadState.textContent='待辦資料尚未就緒，沒有回退掃描正式資料。';});
})();</script></body></html>
