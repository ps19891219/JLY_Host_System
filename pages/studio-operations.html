<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作室營運中心｜JLY</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f7f7f8;color:#222}.wrap{max-width:760px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:16px;margin-bottom:12px}.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.count{background:#f5f5f7;border-radius:14px;padding:12px}.count strong{font-size:24px;display:block}.section h2{font-size:17px}.task{background:#fff;border:1px solid #ececef;border-radius:14px;padding:13px;margin:8px 0}.muted{color:#777;font-size:13px}.empty{padding:18px;text-align:center;color:#777}</style></head><body><main class="wrap"><section class="hero"><h1>工作室營運中心</h1><p class="muted">只顯示已整理好的待處理資料，不掃正式資料重建首頁。</p><div class="counts" id="counts"></div></section><div id="sections"></div></main><script src="../js/modules/studio/studio-operations-view-model.js"></script><script>(function(){const VM=window.JLYStudioOperationsViewModel;function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(view){const items=Array.isArray(view?.items)?view.items:[],s=VM.summary(items),g=VM.group(items);document.getElementById('counts').innerHTML=[['待處理',s.total],['訂場',s.booking],['場次異動',s.activity],['員工',s.staff]].map(x=>'<div class="count"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('');const defs=[['booking','訂場'],['activity','場次／主揪異動'],['staff','員工排班'],['recruitment','揪團'],['other','其他']];document.getElementById('sections').innerHTML=defs.filter(d=>g[d[0]].length).map(d=>'<section class="section card"><h2>'+d[1]+'</h2>'+g[d[0]].map(x=>'<article class="task" data-task-id="'+esc(x.id)+'"><strong>'+esc(x.title)+'</strong>'+(x.subtitle?'<div class="muted">'+esc(x.subtitle)+'</div>':'')+'</article>').join('')+'</section>').join('')||'<div class="card empty">目前沒有待處理事項。</div>'}window.JLYStudioOperationsPage={render};render({items:[]});})();</script></body></html>
