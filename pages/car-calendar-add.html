<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><title>加入行事曆｜JLY</title>
<link rel="stylesheet" href="/css/pages/car-calendar-add.css?v=4"></head>
<body><main class="app"><header><span class="eyebrow">JLY Host System</span><h1>📅 加入我的行事曆</h1><p>先核對本場活動，再選擇加入方式。</p></header>
<section class="panel" aria-live="polite"><p id="loading">正在取得活動資訊…</p><div id="details" hidden><span class="eyebrow">本場活動</span><h2 id="title"></h2><dl><dt>日期時間（台灣）</dt><dd id="times"></dd><dt>地點</dt><dd id="location"></dd></dl><p class="hint">以本場正式車團日期時間為準，請確認無誤再加入。</p></div></section>
<section class="panel" id="manual-panel" hidden>
<h2>請確認活動結束時間</h2>
<p class="help">車團沒有提供活動時長或結束時間。請先向主揪確認，再自行選擇結束時間。這不會修改車團正式資料。</p>
<label for="manual-end">結束日期與時間（台灣）</label>
<input id="manual-end" type="datetime-local" autocomplete="off" required>
<button type="button" id="manual-confirm">確認結束時間</button>
</section>
<section class="panel" id="calendar-choices" hidden>
<h2>加入我的行事曆</h2>
<p class="help">選擇你平常使用的行事曆即可。</p>
<div id="subscription-actions">
<button type="button" id="subscribe">加入我的行事曆</button><p class="help">iPhone 行事曆｜第一次需要確認訂閱，以後新增車團直接加入。</p>
<div id="subscription-result" hidden><a class="extra" id="subscription-link" href="#">開啟 iPhone 行事曆確認</a><button type="button" class="secondary-action" id="subscription-copy">複製訂閱連結</button><button type="button" class="secondary-action" id="subscription-revoke">停用這份訂閱</button></div>
</div>
<div id="actions" hidden>
<button type="button" id="google">加入我的行事曆</button><p class="help">Google 行事曆｜第一次需要 Google 授權，這是單次加入。</p>

</div>
</section>
<p id="status" role="status" aria-live="polite"></p><footer>此頁不會更改車團資料，也不會自動將活動加入你的日曆。</footer>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/js/modules/calendar/calendar-config.js?v=1"></script>
<script src="/js/modules/calendar/calendar-auth.js?v=1"></script>
<script src="/js/car/car-calendar-add.js?v=6"></script>
</body></html>
