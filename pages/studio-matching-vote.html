<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回覆配合時間｜JLY</title><link rel="stylesheet" href="../css/style.css"><style>.studio-vote-slot{display:flex!important;align-items:center;gap:12px;padding:12px 0!important}.studio-vote-slot input{width:28px;height:28px;flex:0 0 28px;margin:0}.studio-vote-slot span{display:inline-block}.studio-vote-host{padding:10px 0 16px;color:#555}.studio-vote-identity{padding:10px 0;font-weight:700}</style></head><body><main class="container"><div class="hero"><div class="jelly">🗓</div><h1 id="voteTitle">配合時間</h1><p>勾選你可以配合的時段。沒有勾選的時段會記為不行；尚未送出的人保持未回覆。</p></div><div class="card"><div id="voteIdentity"><div class="studio-vote-identity">🧪 暫時測試模式：LINE 身分確認稍後恢復</div><label>測試姓名<input id="voteTestName" placeholder="輸入姓名即可測試後續流程"></label></div><div id="voteHost"></div><div id="voteDebug" style="font-size:12px;color:#777;margin:8px 0">頁面版本：vote-debug-8</div><div id="voteSlots">準備載入…</div><button id="voteSubmit" type="button" style="width:100%;margin-top:12px;">送出配合時間</button></div></main> <script>document.getElementById('voteSlots').textContent='JS 啟動中…';window.__JLY_VOTE_BOOT=Date.now();window.addEventListener('error',function(e){document.getElementById('voteSlots').textContent='JS 錯誤：'+(e.message||'未知錯誤')});</script><script src="/js/modules/work-schedule/studio-matching-vote.js?v=8" onerror="document.getElementById('voteSlots').textContent='回覆程式載入失敗'"></script></body></html>
