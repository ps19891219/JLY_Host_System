<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="robots" content="noindex,nofollow">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'"
  >
  <title>JLY LINE 選單設定</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #102a43;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 440px);
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 50px rgba(16, 42, 67, 0.12);
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }

    p {
      line-height: 1.6;
      color: #486581;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-weight: 700;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      box-sizing: border-box;
      font: inherit;
    }

    input {
      border: 1px solid #bcccdc;
      padding: 0 14px;
    }

    button {
      margin-top: 14px;
      border: 0;
      background: #087f8c;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #status {
      min-height: 48px;
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: #edf2f7;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>JLY LINE 選單設定</h1>
    <p>
      此頁只用於一次性套用 JLY 小助手選單。成功後請到 Vercel 關閉設定開關。
    </p>

    <form id="setupForm">
      <label for="secret">一次性管理密碼</label>
      <input
        id="secret"
        name="secret"
        type="password"
        autocomplete="off"
        required
      >
      <button id="submitButton" type="submit">
        套用 LINE 選單
      </button>
    </form>

    <div id="status" role="status" aria-live="polite">
      尚未執行。
    </div>
  </main>

  <script>
    const form = document.getElementById("setupForm");
    const secretInput = document.getElementById("secret");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const secret = secretInput.value.trim();

      if (!secret) {
        status.textContent = "請輸入管理密碼。";
        return;
      }

      submitButton.disabled = true;
      status.textContent = "正在套用，請稍候…";

      try {
        const response = await fetch("/api/setup-line-rich-menu", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ secret })
        });

        const result = await response.json();

        if (!response.ok || result.success !== true) {
          throw new Error(result.error || "setup_failed");
        }

        status.textContent =
          "套用成功。\n請重新開啟手機 LINE 聊天室，並在 Vercel 關閉設定開關。";
        secretInput.value = "";
      } catch (error) {
        status.textContent =
          "套用失敗：" + error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
