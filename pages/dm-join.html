<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前往 DM 身分申請</title>
</head>
<body>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var id = p.get("id") || p.get("carId") || "";
  var next = new URLSearchParams();
  if (id) next.set("id", id);
  if (p.get("groupToken")) next.set("groupToken", p.get("groupToken"));
  next.set("apply", "dm");
  location.replace("/pages/car-view.html?" + next.toString());
})();
</script>
</body>
</html>
