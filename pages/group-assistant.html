<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>JLY 群組小助手</title>

  <link
    rel="stylesheet"
    href="/css/group-assistant.css?v=3"
  >

  <style>
    .split-form fieldset .share-row {
      display: grid;
      grid-template-columns: 24px 1fr 110px;
      gap: 10px;
      align-items: center;
    }

    .split-form fieldset .share-check {
      width: 22px;
    }

    .split-form fieldset .share-amount {
      width: 100%;
      margin: 0;
      text-align: right;
    }

    .share-amount:disabled {
      opacity: .45;
    }

    .list span strong,
    .list span small {
      display: block;
    }

    .list span small {
      margin-top: 4px;
      color: #83776d;
      font-size: 12px;
    }

    /* ================================
       Accounting sub navigation
       V2.71
       ================================ */

    .accounting-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0 18px;
    }

    .accounting-tabs button {
      border: 0;
      border-radius: 14px;
      padding: 11px 8px;
      background: rgba(255, 255, 255, .72);
      color: inherit;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .accounting-tabs button.active {
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .07);
    }

    .accounting-panel.hidden {
      display: none;
    }

    .accounting-section-title {
      margin-top: 22px;
    }

    .settlement-note {
      margin: 8px 0 16px;
      color: #83776d;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- ================================
         Header
         ================================ -->

    <header class="hero">
      <span class="bear">🐻</span>

      <div>
        <p>JLY 群組小助手</p>
        <h1 id="scriptName">正在載入車團</h1>
        <small id="carMeta"></small>
      </div>
    </header>


    <!-- ================================
         Main navigation
         ================================ -->

    <nav
      class="tabs"
      aria-label="功能選單"
    >
      <button data-tab="info">
        車團
      </button>

      <button data-tab="accounting">
        車團總帳
      </button>

      <button data-tab="members">
        成員
      </button>

      <button data-tab="notices">
        公告
      </button>
    </nav>


    <!-- ================================
         Loading / Error
         ================================ -->

    <section
      id="loading"
      class="panel"
    >
      正在讀取車團資料…
    </section>

    <section
      id="error"
      class="panel hidden"
    ></section>


    <!-- ================================
         Car info
         ================================ -->

    <section
      id="info"
      class="panel tab-panel hidden"
    >
      <h2>車團資訊</h2>

      <div id="infoContent"></div>
    </section>


    <!-- ================================
         Accounting
         ================================ -->

    <section
      id="accounting"
      class="panel tab-panel hidden"
    >

      <h2>車團總帳</h2>

      <!-- Accounting second-level tabs -->

      <nav
        class="accounting-tabs"
        aria-label="車團總帳功能"
      >
        <button
          type="button"
          data-accounting-tab="overview"
          class="active"
        >
          總覽
        </button>

        <button
          type="button"
          data-accounting-tab="settlements"
        >
          待結清
        </button>

        <button
          type="button"
          data-accounting-tab="entries"
        >
          帳目
        </button>
      </nav>


      <!-- ================================
           Accounting / Overview
           ================================ -->

      <section
        id="accounting-overview"
        class="accounting-panel"
      >

        <div class="totals">
          <article>
            <span>總收入</span>
            <b id="income">$0</b>
          </article>

          <article>
            <span>總支出</span>
            <b id="expense">$0</b>
          </article>

          <article>
            <span>待結清</span>
            <b id="balance">$0</b>
          </article>
        </div>

        <h3 class="accounting-section-title">
          成員付款統計
        </h3>

        <div
          id="memberBalances"
          class="list empty"
        >
          目前沒有分帳資料
        </div>

      </section>


      <!-- ================================
           Accounting / Settlements
           ================================ -->

      <section
        id="accounting-settlements"
        class="accounting-panel hidden"
      >

        <h3>結算狀態</h3>

        <p class="settlement-note">
          系統內成員完成付款與收款確認後，
          車團總帳會自動同步結清狀態。
          未加入 JLY 的成員，後續可由主揪協助人工核銷。
        </p>

        <div
          id="settlementTransfers"
          class="list empty"
        >
          目前沒有待結清帳款
        </div>

      </section>


      <!-- ================================
           Accounting / Entries
           ================================ -->

      <section
        id="accounting-entries"
        class="accounting-panel hidden"
      >

        <button
          class="primary"
          id="createSplit"
          type="button"
        >
          ＋ 新增帳目
        </button>


        <!-- LINE login -->

        <div
          id="loginPrompt"
          class="notice hidden"
        >
          新增或分帳前，請先使用 LINE 登入。

          <button
            id="lineLogin"
            class="secondary"
            type="button"
          >
            LINE 登入
          </button>
        </div>


        <!-- Split form -->

        <form
          id="splitForm"
          class="split-form hidden"
          novalidate
        >

          <h3 id="formTitle">
            新增帳目
          </h3>

          <label>
            類型

            <select id="entryType">
              <option value="expense">
                支出
              </option>

              <option value="income">
                收入
              </option>
            </select>
          </label>


          <label>
            金額

            <input
              id="entryAmount"
              type="number"
              min="1"
              step="1"
              required
              inputmode="numeric"
            >
          </label>


          <label>
            說明

            <input
              id="entryDescription"
              maxlength="80"
              required
              placeholder="例如：晚餐費用"
            >
          </label>


          <label id="splitModeField">
            處理方式

            <select id="splitMode">
              <option value="later">
                先記總額，之後再分帳
              </option>

              <option value="now">
                現在立即分帳
              </option>
            </select>
          </label>


          <label>
            付款人

            <select
              id="payerMember"
              required
            ></select>
          </label>


          <fieldset
            id="shareMembers"
            class="hidden"
          >
            <legend>
              每位成員分多少（預設平均，可修改）
            </legend>

            <div id="shareMemberList"></div>
          </fieldset>


          <p
            id="formStatus"
            class="notice hidden"
          ></p>


          <button
            class="primary"
            id="saveSplit"
            type="submit"
          >
            儲存
          </button>

          <button
            class="secondary"
            id="cancelSplit"
            type="button"
          >
            取消
          </button>

        </form>


        <!-- Pending split -->

        <h3 class="accounting-section-title">
          待分帳項目
        </h3>

        <div
          id="pendingEntries"
          class="list empty"
        >
          目前沒有待分帳項目
        </div>


        <!-- Entry history -->

        <h3 class="accounting-section-title">
          帳目紀錄
        </h3>

        <div
          id="accountingEntries"
          class="list empty"
        >
          目前沒有帳目紀錄
        </div>

      </section>

    </section>


    <!-- ================================
         Members
         ================================ -->

    <section
      id="members"
      class="panel tab-panel hidden"
    >
      <h2>成員功能</h2>

      <p>
        成員名單功能將在下一階段加入。
      </p>
    </section>


    <!-- ================================
         Notices
         ================================ -->

    <section
      id="notices"
      class="panel tab-panel hidden"
    >
      <h2>車團公告</h2>

      <p>
        目前沒有車團公告。
      </p>
    </section>

  </main>


  <script src="/js/group-assistant.js?v=8"></script>
</body>
</html>
