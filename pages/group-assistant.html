<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JLY 群組小助手</title><link rel="stylesheet" href="/css/group-assistant.css?v=3"><style>.split-form fieldset .share-row{display:grid;grid-template-columns:24px 1fr 110px;gap:10px;align-items:center}.split-form fieldset .share-check{width:22px}.split-form fieldset .share-amount{width:100%;margin:0;text-align:right}.share-amount:disabled{opacity:.45}.list span strong,.list span small{display:block}.list span small{margin-top:4px;color:#83776d;font-size:12px}</style></head><body><main class="app">
<header class="hero"><span class="bear">🐻</span><div><p>JLY 群組小助手</p><h1 id="scriptName">正在載入車團</h1><small id="carMeta"></small></div></header>
<nav class="tabs" aria-label="功能選單"><button data-tab="info">車團</button><button data-tab="accounting">記帳</button><button data-tab="members">成員</button><button data-tab="notices">公告</button></nav>
<section id="loading" class="panel">正在讀取車團資料…</section><section id="error" class="panel hidden"></section>
<section id="info" class="panel tab-panel hidden"><h2>車團資訊</h2><div id="infoContent"></div></section>
<section id="accounting" class="panel tab-panel hidden"><h2>車團總帳</h2><div class="totals"><article><span>總收入</span><b id="income">$0</b></article><article><span>總支出</span><b id="expense">$0</b></article><article><span>待結清</span><b id="balance">$0</b></article></div>
<button class="primary" id="createSplit">＋ 新增帳目</button><div id="loginPrompt" class="notice hidden">新增或分帳前，請先使用 LINE 登入。<button id="lineLogin" class="secondary">LINE 登入</button></div>
<form id="splitForm" class="split-form hidden" novalidate><h3 id="formTitle">新增帳目</h3><label>類型<select id="entryType"><option value="expense">支出</option><option value="income">收入</option></select></label><label>金額<input id="entryAmount" type="number" min="1" step="1" required inputmode="numeric"></label><label>說明<input id="entryDescription" maxlength="80" required placeholder="例如：晚餐費用"></label><label id="splitModeField">處理方式<select id="splitMode"><option value="later">先記總額，之後再分帳</option><option value="now">現在立即分帳</option></select></label><label>付款人<select id="payerMember" required></select></label><fieldset id="shareMembers" class="hidden"><legend>每位成員分多少（預設平均，可修改）</legend><div id="shareMemberList"></div></fieldset><p id="formStatus" class="notice hidden"></p><button class="primary" id="saveSplit" type="submit">儲存</button><button class="secondary" id="cancelSplit" type="button">取消</button></form>
<h3>成員付款統計</h3><div id="memberBalances" class="list empty">目前沒有分帳資料</div><h3>一對一結算結果</h3><div id="settlementTransfers" class="list empty">目前沒有待結清帳款</div><h3>待分帳項目</h3><div id="pendingEntries" class="list empty">目前沒有待分帳項目</div></section>
<section id="members" class="panel tab-panel hidden"><h2>成員功能</h2><p>成員名單功能將在下一階段加入。</p></section><section id="notices" class="panel tab-panel hidden"><h2>車團公告</h2><p>目前沒有車團公告。</p></section></main><script src="/js/group-assistant.js?v=7"></script></body></html>
