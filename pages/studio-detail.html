<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>凱崴私團｜工作室管理｜JLY</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container">
    <div class="hero">
      <div class="jelly">🏢</div>
      <h1>凱崴私團</h1>
      <p>工作室管理</p>
    </div>

    <div class="card">
      <h2>工作室功能</h2>
      <p>目前既有 Work Schedule 先由凱崴私團入口管理。這只是入口與責任切割，不複製既有排班資料。</p>
    </div>

    <button type="button" style="width:100%;" onclick="location.href='work-schedule.html?studio=kaiwei-private'">📅 排班表</button>
    <button type="button" style="width:100%;margin-top:12px;" onclick="location.href='work-schedule.html?studio=kaiwei-private&view=works'">🎭 劇本</button>
    <button type="button" style="width:100%;margin-top:12px;" onclick="location.href='work-schedule.html?studio=kaiwei-private&view=works&create=1'">＋ 新增劇本</button>

    <div class="card" style="margin-top:18px;">
      <h2>工作室設定</h2>
      <p>正式 Studio／Organization 權限、名稱與成員管理會沿這個入口擴充；不把工作室資料塞回「我的車」。</p>
    </div>

    <button type="button" class="gray" onclick="location.href='studio.html'">← 返回工作室列表</button>
  </main>

</html>
