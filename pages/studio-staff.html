<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>員工專區｜JLY 工作室後台</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container">
    <div class="hero">
      <div class="jelly">👥</div>
      <h1>員工專區</h1>
      <p>工作室既有排班人員入口</p>
    </div>
    <div class="card">
      <h2>員工班表</h2>
      <p>目前先沿用既有 Work Schedule 人員資料，不建立第二套員工資料庫，也不啟用核准流程。</p>
      <button id="openStaffSchedule" type="button" style="width:100%;">📅 開啟員工班表</button>
      <button id="copyStaffSchedule" type="button" class="gray" style="width:100%;margin-top:10px;">🔗 複製員工班表連結</button>
      <p style="margin-top:12px;">員工從此連結 LINE 登入後，可查看班表、只看自己的班，並把自己的班批次匯入 Google Calendar。</p>
    </div>
    <div class="card">
      <h2>目前人員來源</h2>
      <p>員工身分暫時由既有排班工作／班次中的人員關係判斷。永久工作室 Membership 與核准流程保留到下一階段再設計。</p>
    </div>
    <button id="backStudio" type="button" class="gray">← 返回工作室</button>
  </main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const studio=String(params.get('studio')||'kaiwei-private').trim();
  const staffUrl=()=>`${location.origin}/pages/work-schedule-staff.html?studio=${encodeURIComponent(studio)}`;
  document.getElementById('openStaffSchedule').onclick=()=>location.href=staffUrl();
  document.getElementById('copyStaffSchedule').onclick=async()=>{try{await navigator.clipboard.writeText(staffUrl());alert('已複製員工班表連結。')}catch(_){prompt('複製員工班表連結：',staffUrl())}};
  document.getElementById('backStudio').onclick=()=>location.href=`studio-detail.html?studio=${encodeURIComponent(studio)}`;
})();
</script>
</body>
</html>
