<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配合時間／媒合｜JLY</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><div class="hero"><div class="jelly">🗓</div><h1>配合時間／媒合</h1><p>先收集可配合時間，媒合成功後才進正式排班。</p></div><div class="card"><h2>建立本次媒合</h2><p>先選既有劇本，再用月曆一次選多天。媒合成功後會直接帶回這個劇本的正式排班。</p><label>既有劇本<select id="studioMatchingWork"><option value="">讀取劇本中…</option></select></label><label>媒合名稱<input id="studioMatchingTitle" placeholder="選劇本後自動帶入，可再修改"></label><section><strong>候選日期</strong><div class="session-composer-calendar-nav"><button type="button" class="ghost" id="studioMatchingPrev">‹</button><select id="studioMatchingYear"></select><select id="studioMatchingMonth"></select><button type="button" class="ghost" id="studioMatchingNext">›</button></div><div class="session-composer-calendar-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="studioMatchingCalendar" class="session-composer-calendar"></div><small id="studioMatchingDateCount">已選 0 天，可切換月份繼續選。</small></section><section style="margin-top:16px"><strong>需要徵詢的時段</strong><div id="studioMatchingPeriods"></div><button id="studioMatchingCustomAdd" class="ghost" type="button">＋ 自訂時段</button></section><button id="studioMatchingSave" type="button" style="width:100%;margin-top:12px;">建立媒合</button></div><div class="card"><h2>進行中的媒合</h2><div id="studioMatchingList">讀取中…</div></div><button type="button" class="gray" onclick="history.back()">← 返回工作室</button></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="/firebase/firebase.js?v=27"></script><script src="/js/core/identity.js?v=2"></script><script src="/js/modules/member/picker/picker-data.js?v=2"></script><script src="/js/modules/work-schedule/work-schedule-matching-bridge.js?v=3"></script><script src="/js/modules/work-schedule/studio-matching-workspace.js?v=3"></script></body></html>
